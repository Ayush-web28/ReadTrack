# nginx does in Docker what the Vite dev proxy does in development:
# one origin for the browser, with API paths forwarded to the right service.
# "rest-api" and "graphql-api" are the service names from docker-compose.yml.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/books  ->  http://rest-api:8000/books   (the trailing slashes strip the /api prefix)
    location /api/ {
        proxy_pass http://rest-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Open Library searches can be slow; allow the gateway time to answer.
        proxy_read_timeout 60s;
    }

    location /graphql {
        proxy_pass http://graphql-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Single-page app: any other URL (e.g. /books/7) serves index.html and
    # React Router decides what to show. Real files (JS, CSS) are served as they are.
    location / {
        try_files $uri /index.html;
    }
}
